name: Deploy CAPITÃO to Cloudflare Workers\n\non:\n  push:\n    branches:\n      - main\n  workflow_dispatch:\n\nconcurrency:\n  group: capitao-production\n  cancel-in-progress: true\n\npermissions:\n  contents: read\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    env:\n      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\n      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jfufhsrhlatsstcdvhmb.supabase.co' }}\n      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}\n      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://capitao-preview.luiz-ztx.workers.dev' }}\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version-file: .nvmrc\n\n      - name: Install dependencies\n        run: npm install --no-audit --no-fund\n\n      - name: Normalize Cloudflare credentials\n        run: node scripts/normalize-cloudflare-env.mjs\n\n      - name: Validate Cloudflare authentication\n        run: npx wrangler whoami\n\n      - name: Validate environment\n        run: node scripts/check-cloudflare-env.mjs production\n\n      - name: Security scan\n        run: npm run security:scan\n\n      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Build for Cloudflare\n        run: npm run cf:build\n\n      - name: Deploy Worker\n        run: npx @vinext/cloudflare deploy --skip-build\n\n      - name: Validate production dynamic routes\n        shell: bash\n        run: |\n          set -euo pipefail\n          BASE="https://capitao-preview.luiz-ztx.workers.dev"\n          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36"\n          for path in / /explorar /explorar/mapa /admin /perfil/cadastros; do\n            ok=0\n            for attempt in 1 2 3 4 5; do\n              code=$(curl -A "$UA" -L -sS -o "/tmp/capitao-response.html" -w "%{http_code}" "$BASE$path" || true)\n              echo "$path attempt $attempt -> HTTP $code"\n              if [ "$code" = "200" ]; then\n                ok=1\n                break\n              fi\n              sleep 8\n            done\n            if [ "$ok" != "1" ]; then\n              echo "Production route failed: $path"\n              exit 1\n            fi\n          done\n